name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and run tests
        run: npm run check
      - name: Verify static site files
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s favicon.svg
          test -s src/app.mjs
          test -s src/catalog.mjs
          test -s src/engine.mjs
